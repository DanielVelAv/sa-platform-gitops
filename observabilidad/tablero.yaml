# Tablero de operacion de Grafana (P10). Grafana lo carga solo gracias al
# sidecar (etiqueta grafana_dashboard). Copia de P10/tablero/tablero-operacion.json
# del repositorio de codigo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tablero-operacion
  namespace: observabilidad
  labels:
    grafana_dashboard: "1"
data:
  tablero-operacion.json: |
    {
      "title": "sa-platform — Operación (4 señales de oro)",
      "uid": "sa-platform-operacion",
      "editable": true,
      "description": "Tablero de operación de la Práctica 10: responde si se cumplen los SLO y, ante un problema, qué servicio y qué señal lo explica.",
      "tags": [
        "p10",
        "slo",
        "golden-signals"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "¿Estamos cumpliendo lo que prometemos a los usuarios? (SLO, ventana 7 días)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Peticiones sin error (objetivo 99.5 %)",
          "description": "SLO 1: fracción de peticiones de usuarios respondidas sin error 5xx en 7 días.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - slo:sli_error:ratio_rate7d{slo=\"disponibilidad\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Presupuesto de errores restante",
          "description": "Cuánto margen de fallos queda esta semana para el SLO de disponibilidad. 0 % = prometido incumplido.",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:presupuesto_restante:ratio{slo=\"disponibilidad\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Peticiones en menos de 1 s (objetivo 99 %)",
          "description": "SLO 2: fracción de peticiones respondidas en menos de 1 s en 7 días.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - slo:sli_error:ratio_rate7d{slo=\"latencia\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Presupuesto de lentitud restante",
          "description": "Margen de peticiones lentas que queda esta semana para el SLO de latencia.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:presupuesto_restante:ratio{slo=\"latencia\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Latencia — ¿qué tan rápido responde cada servicio?",
          "id": 6,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          }
        },
        {
          "type": "timeseries",
          "title": "¿Cuánto espera el usuario? (p95 y p50 en el gateway)",
          "description": "Percentiles de la duración de las peticiones /api. La línea roja es el umbral del SLO (1 s).",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{namespace=\"sa-p9-produccion\", servicio=\"api-gateway\", http_route=~\"/api.*\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_bucket{namespace=\"sa-p9-produccion\", servicio=\"api-gateway\", http_route=~\"/api.*\"}[5m])))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "¿Qué servicio agrega la demora? (p95 por servicio)",
          "description": "p95 de cada microservicio: si el gateway sube y ms-auth también, la causa está aguas abajo.",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, servicio) (rate(http_server_request_duration_bucket{namespace=\"sa-p9-produccion\"}[5m])))",
              "legendFormat": "{{servicio}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Tráfico — ¿cuánto se usa el sistema y para qué?",
          "id": 9,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          }
        },
        {
          "type": "timeseries",
          "title": "Peticiones por segundo por servicio",
          "description": "Carga atendida por cada microservicio.",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (servicio) (rate(http_server_request_duration_count{namespace=\"sa-p9-produccion\"}[5m]))",
              "legendFormat": "{{servicio}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Inicios de sesión por minuto (negocio)",
          "description": "Personas que entran al sistema, rechazadas por contraseña y errores del sistema al intentarlo.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (resultado) (rate(inicios_sesion_total{namespace=\"sa-p9-produccion\"}[5m])) * 60",
              "legendFormat": "{{resultado}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Lotes de pagos cargados por minuto (negocio)",
          "description": "Lotes cargados por los clientes y monto en quetzales por minuto.",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(lotes_creados_total{namespace=\"sa-p9-produccion\"}[5m])) * 60",
              "legendFormat": "lotes/min",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(lotes_monto_quetzales_total{namespace=\"sa-p9-produccion\"}[5m])) * 60",
              "legendFormat": "Q/min",
              "refId": "B"
            }
          ]
        },
        {
          "type": "row",
          "title": "Errores — ¿están fallando las peticiones? ¿dónde?",
          "id": 13,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          }
        },
        {
          "type": "timeseries",
          "title": "% de peticiones con error 5xx por servicio",
          "description": "Fracción de respuestas con error del servidor. Línea roja: ritmo que dispara la alerta de consumo rápido (7.2 %).",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.072
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (servicio) (rate(http_server_request_duration_count{namespace=\"sa-p9-produccion\", http_response_status_code=~\"5..\"}[5m])) / sum by (servicio) (rate(http_server_request_duration_count{namespace=\"sa-p9-produccion\"}[5m]))",
              "legendFormat": "{{servicio}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "¿Qué ruta falla? (errores 5xx por segundo)",
          "description": "Ruta y código de las respuestas con error, para saber por dónde empezar.",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (servicio, http_route, http_response_status_code) (rate(http_server_request_duration_count{namespace=\"sa-p9-produccion\", http_response_status_code=~\"5..\"}[5m]))",
              "legendFormat": "{{servicio}} {{http_route}} {{http_response_status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Saturación — ¿se están quedando sin recursos?",
          "id": 16,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          }
        },
        {
          "type": "timeseries",
          "title": "CPU usada respecto a su límite",
          "description": "Uso de CPU de cada pod frente al límite declarado. Cerca de 100 % = estrangulamiento.",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"sa-p9-produccion\", container!=\"\", pod=~\"sa-platform-(api-gateway|ms-auth|ms-lotes|postgresql).*\"}[5m])) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"sa-p9-produccion\", resource=\"cpu\", pod=~\"sa-platform-(api-gateway|ms-auth|ms-lotes|postgresql).*\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memoria usada respecto a su límite",
          "description": "Memoria en uso frente al límite. Al llegar a 100 % el pod se reinicia (OOMKilled).",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"sa-p9-produccion\", container!=\"\", pod=~\"sa-platform-(api-gateway|ms-auth|ms-lotes|postgresql).*\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"sa-p9-produccion\", resource=\"memory\", pod=~\"sa-platform-(api-gateway|ms-auth|ms-lotes|postgresql).*\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Retraso del event loop de Node (p99)",
          "description": "Si sube, el proceso está saturado y todas sus peticiones esperan.",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (servicio) (nodejs_eventloop_delay_p99_seconds{namespace=\"sa-p9-produccion\"} or nodejs_eventloop_delay_p99{namespace=\"sa-p9-produccion\"})",
              "legendFormat": "{{servicio}}",
              "refId": "A"
            }
          ]
        }
      ],
      "links": [
        {
          "title": "Runbooks",
          "type": "link",
          "url": "https://github.com/DanielVelAv/Pr-cticas-SA-B-202200041/tree/main/P10/runbooks",
          "targetBlank": true
        }
      ]
    }
