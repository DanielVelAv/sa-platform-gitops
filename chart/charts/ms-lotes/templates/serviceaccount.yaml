{{- $ctx := dict "raiz" . "componente" .Values.nombre -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.nombreCompleto" $ctx }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
---
# Role de MINIMO PRIVILEGIO: el servicio no administra el cluster, solo
# necesita leer su propia configuracion. Se limita por resourceNames a
# los dos objetos concretos, no a todos los del namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.nombreCompleto" $ctx }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ .Values.global.configMapName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.nombreCompleto" $ctx }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.nombreCompleto" $ctx }}
    namespace: {{ .Values.global.namespace | quote }}
roleRef:
  kind: Role
  name: {{ include "sa-platform.nombreCompleto" $ctx }}
  apiGroup: rbac.authorization.k8s.io
