{{- $nombre := .Values.nombre -}}
{{- $ctx := dict "raiz" . "componente" $nombre -}}
{{/*
Convertido de Deployment a Rollout (Argo Rollouts) para la Practica 8.
El spec.template (contenedores, env, probes, securityContext, volumenes)
queda IDENTICO al Deployment original de la P5/P7 -- unicamente cambian
apiVersion/kind y la seccion "strategy", que pasa de RollingUpdate a
canary con pasos de promocion.

Canary "basico" (sin trafficRouting/service mesh): Argo Rollouts reparte
el trafico aproximando el peso por PROPORCION DE REPLICAS bajo el mismo
Service que ya existe (charts/api-gateway/templates/service.yaml), sin
necesitar Istio/NGINX/ALB. Es el punto de partida estandar y real de
Argo Rollouts, no una simulacion.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "sa-platform.nombreCompleto" $ctx }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.etiquetas" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "sa-platform.etiquetasSelector" $ctx | nindent 6 }}
  strategy:
    canary:
      # Argo Rollouts reescribe automaticamente el selector de este
      # Service en cada paso, para que apunte SOLO a los pods del
      # canario -- sin necesitar Istio ni ningun service mesh. Asi el
      # AnalysisTemplate mide unicamente la version candidata, no una
      # mezcla con el estable.
      canaryService: {{ include "sa-platform.nombreCompleto" $ctx }}-canary
      # 3 pasos de setWeight (requisito: al menos 3), con un analisis
      # inline entre el primer y el segundo paso -- si el analisis
      # falla, Argo Rollouts revierte automaticamente sin avanzar mas.
      # P10: el analisis consulta Prometheus (tasa de error y p95 del
      # canary) en lugar de una prueba sintetica. La pausa previa deja que
      # el canary reciba trafico real del generador antes de medir.
      steps:
        - setWeight: 20
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: api-gateway-metricas-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause:
            duration: 30s
        # Segunda verificacion con la mitad del trafico real; al terminar
        # los pasos, Argo Rollouts promueve al 100 %.
        - analysis:
            templates:
              - templateName: api-gateway-metricas-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
  template:
    metadata:
      annotations:
        checksum/config: {{ toYaml .Values.global.config | sha256sum }}
      labels:
        {{- include "sa-platform.etiquetasSelector" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sa-platform.nombreCompleto" $ctx }}
      securityContext:
        runAsNonRoot: {{ .Values.global.securityContext.runAsNonRoot | default true }}
        fsGroup: {{ .Values.global.securityContext.runAsGroup | default 1000 }}
      {{- with .Values.affinity }}
      # P9: anti-afinidad para que las replicas queden en nodos distintos
      # y el servicio sobreviva al drenaje de un nodo.
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $nombre | quote }}
          image: {{ include "sa-platform.imagen" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.puerto }}
            # P10: metricas del SDK de OpenTelemetry (exportador Prometheus).
            - name: metricas
              containerPort: 9464
          envFrom:
            {{- include "sa-platform.envFromComun" . | nindent 12 }}
          env:
            {{- include "sa-platform.envSecretos" . | nindent 12 }}
            # P10: telemetria. El nombre del servicio identifica trazas,
            # metricas y registros; el resto sale de global.otelEnv.
            - name: OTEL_SERVICE_NAME
              value: {{ $nombre | quote }}
            {{- range $k, $v := .Values.global.otelEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # P10: fallo inducido (fraccion de peticiones /api que responden 500).
            - name: TASA_FALLO
              value: {{ .Values.tasaFallo | default "0" | quote }}
            - name: SIMULAR_FALLO
              value: {{ .Values.simularFallo | default "false" | quote }}
          {{- include "sa-platform.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "sa-platform.contextoSeguridad" . | nindent 12 }}
          volumeMounts:
            {{- include "sa-platform.montajesTemporales" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "sa-platform.volumenesTemporales" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
