{{- /*
P10: el canary deja de decidir con una prueba sintetica (el /health de la
P8) y pasa a decidir con el TRAFICO REAL medido en Prometheus, solo sobre
los pods de la version candidata (etiqueta rollouts-pod-template-hash del
pod canary, que el PodMonitor copia a cada serie).

- tasa-de-error: fraccion de respuestas 5xx a peticiones de usuarios (/api).
- latencia-p95: percentil 95 de la duracion de esas peticiones.
Si una de las dos supera su umbral en mas de failureLimit mediciones, el
AnalysisRun falla y Argo Rollouts aborta el canary (vuelve a la estable)
sin intervencion humana. Sin trafico (division por cero) cuenta como 0.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-metricas-canary
  namespace: {{ .Values.global.namespace | quote }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: tasa-de-error
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: "result[0] < {{ .Values.analisis.maxTasaError | default 0.05 }}"
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus | quote }}
          query: |
            (sum(rate(http_server_request_duration_count{namespace="{{ .Values.global.namespace }}", servicio="api-gateway", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}", http_route=~"/api.*", http_response_status_code=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(http_server_request_duration_count{namespace="{{ .Values.global.namespace }}", servicio="api-gateway", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}", http_route=~"/api.*"}[1m])) > 0 or vector(1))
    - name: latencia-p95
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: "result[0] < {{ .Values.analisis.maxLatenciaP95 | default 0.5 }}"
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus | quote }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{namespace="{{ .Values.global.namespace }}", servicio="api-gateway", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}", http_route=~"/api.*"}[1m]))) or vector(0)
