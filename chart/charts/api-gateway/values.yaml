# Valores por defecto del subchart api-gateway.
# El chart padre los sobreescribe desde su propio values.yaml,
# en la clave "api-gateway". No edite este archivo: edite el del padre.
enabled: true
puerto: 8080
nombre: api-gateway
image:
  repository: sa-p5/api-gateway
  tag: ""
service:
  type: ClusterIP
replicas: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
probes:
  startup: { path: /health, periodSeconds: 5, failureThreshold: 12 }
  readiness: { path: /health, periodSeconds: 10, failureThreshold: 3 }
  liveness: { path: /health, periodSeconds: 20, failureThreshold: 3 }
extraVolumes: []
extraVolumeMounts: []
usaBaseDatos: false
usaBroker: false
secretosExtra: []
