# =====================================================================
# values-dev.yaml — ambiente de desarrollo.
# Menos replicas, limites holgados, log verboso e imagen de desarrollo.
# Uso: helm upgrade --install sa-platform ./charts/sa-platform \
#        -f charts/sa-platform/values-dev.yaml -f mis-secretos.yaml
# =====================================================================

global:
  imageTag: "dev"
  imagePullPolicy: IfNotPresent
  config:
    logLevel: info
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# En desarrollo basta con una replica: se ahorra RAM del cluster local
api-gateway:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }

ms-auth:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }

ms-lotes:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }

ms-aprobaciones:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }

ms-notificaciones:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }

# El HPA se deja activo pero con techo bajo, para poder probarlo
# en un cluster local sin agotar recursos.

resourceQuota:
  requestsCpu: "2"
  requestsMemory: 3Gi
  limitsCpu: "8"
  limitsMemory: 6Gi
  pods: "25"

postgresql:
  primary:
    persistence:
      size: 1Gi

rabbitmq:
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: "4.1.3-debian-12-r1"
