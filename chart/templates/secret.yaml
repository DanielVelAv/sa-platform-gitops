{{/*
=======================================================================
Secret con TODAS las credenciales (requisito B).

`required` es deliberado: si la credencial no se pasa al instalar, el
despliegue falla de inmediato con un mensaje claro. Es lo que garantiza
que ninguna credencial quede escrita en el repositorio — el chart
literalmente no puede instalarse con valores por defecto.

  helm upgrade --install sa-platform ./charts/sa-platform \
    --namespace sa-p5 \
    -f charts/sa-platform/values-dev.yaml \
    -f secretos.yaml \
    --set-file secrets.jwtPrivateKey=keys/jwt_private.pem \
    --set-file secrets.jwtPublicKey=keys/jwt_public.pem
=======================================================================
*/}}
{{- $g := .Values.global -}}
{{- $usuario := $g.postgresUser | default "sa" -}}
{{- $host := printf "%s-postgresql" .Release.Name -}}
{{- $puerto := $g.postgresPort | default 5432 -}}
{{- $clave := required "Falta secrets.postgresPassword. Copie values.example.yaml y pase el archivo con -f" .Values.secrets.postgresPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $g.secretName | quote }}
  namespace: {{ $g.namespace | quote }}
  labels:
    {{- include "sa-platform.etiquetas" (dict "raiz" . "componente" "secretos") | nindent 4 }}
type: Opaque
stringData:
  # ---------- Credenciales de las dependencias ----------
  # Los subcharts de Bitnami leen estas mismas claves (ver values.yaml).
  postgres-password: {{ $clave | quote }}
  rabbitmq-password: {{ required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword | quote }}

  # ---------- Cifrado heredado de la Practica 2 ----------
  AES_KEY: {{ required "Falta secrets.aesKey (32 bytes en base64)" .Values.secrets.aesKey | quote }}
  BLIND_INDEX_KEY: {{ required "Falta secrets.blindIndexKey (32 bytes en base64, distinta de aesKey)" .Values.secrets.blindIndexKey | quote }}

  # ---------- Par de llaves RSA que firma los JWT ----------
  # Se inyectan con --set-file desde archivos locales, nunca versionados.
  jwt-private-key: {{ required "Falta secrets.jwtPrivateKey. Use --set-file secrets.jwtPrivateKey=keys/jwt_private.pem" .Values.secrets.jwtPrivateKey | quote }}
  jwt-public-key: {{ required "Falta secrets.jwtPublicKey. Use --set-file secrets.jwtPublicKey=keys/jwt_public.pem" .Values.secrets.jwtPublicKey | quote }}

  # ---------- Cadenas de conexion, una por microservicio ----------
  # Llevan la contrasena embebida, por eso viven en el Secret y no en el
  # ConfigMap. Cada servicio recibe SOLO la de su propia base de datos:
  # es la expresion en configuracion del principio de una base por
  # microservicio.
  {{- range $servicio, $base := dict "ms-auth" "auth_db" "ms-lotes" "lotes_db" "ms-aprobaciones" "aprobaciones_db" "ms-notificaciones" "notificaciones_db" }}
  {{ printf "database-url-%s" $servicio }}: {{ printf "postgresql://%s:%s@%s:%v/%s" $usuario $clave $host $puerto $base | quote }}
  {{- end }}

  # Los cronjobs tienen su PROPIA base: no comparten la de ningun
  # microservicio, igual que el resto de componentes.
  database-url-cronjobs: {{ printf "postgresql://%s:%s@%s:%v/%s" $usuario $clave $host $puerto "cron_db" | quote }}

  # ---------- Cadena de conexion al broker ----------
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s-rabbitmq:%v/" ($g.rabbitmqUser | default "sa") (required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword) .Release.Name ($g.rabbitmqPort | default 5672) | quote }}
