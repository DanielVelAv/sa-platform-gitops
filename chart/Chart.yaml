apiVersion: v2
name: sa-platform
description: Plataforma de microservicios bancarios de la Practica 5 - Software Avanzado USAC
type: application

version: 1.0.0
appVersion: "1.0.0"

keywords:
  - microservicios
  - helm
  - kubernetes

dependencies:
  # ================================================================
  # Subcharts propios
  # ================================================================
  - name: api-gateway
    version: "1.0.0"
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled

  - name: ms-auth
    version: "1.0.0"
    repository: "file://charts/ms-auth"
    condition: ms-auth.enabled

  - name: ms-lotes
    version: "1.0.0"
    repository: "file://charts/ms-lotes"
    condition: ms-lotes.enabled

  - name: ms-aprobaciones
    version: "1.0.0"
    repository: "file://charts/ms-aprobaciones"
    condition: ms-aprobaciones.enabled

  - name: ms-notificaciones
    version: "1.0.0"
    repository: "file://charts/ms-notificaciones"
    condition: ms-notificaciones.enabled

  # ================================================================
  # Dependencias externas
  # ================================================================
  - name: postgresql
    version: "*"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: rabbitmq
    version: "14.6.6"
    repository: https://charts.bitnami.com/bitnami
