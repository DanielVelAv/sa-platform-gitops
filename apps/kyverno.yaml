# Wave -2: motor de politicas de admision. Reducido a lo esencial para
# un cluster kind de laptop (sin cleanup ni reports controller).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        # El webhook de admision solo intercepta los namespaces de la
        # plataforma (las politicas solo aplican ahi). Con el valor por
        # defecto (todo menos kube-system) y failurePolicy Fail, mientras
        # Kyverno arranca rechaza CUALQUIER pod del cluster: en un ensayo de
        # reconstruccion bloqueo los pods de Velero que restauran el volumen
        # de PostgreSQL y la restauracion fallo.
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values: [sa-p9-produccion, sa-p9-staging]
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # El chart declara labels: {} y annotations: {} vacios en sus CRDs;
  # con Server-Side Apply Kubernetes no guarda mapas vacios y ArgoCD veria
  # una diferencia perpetua (OutOfSync falso). Se ignoran solo esos campos.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
