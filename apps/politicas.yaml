# Wave -1: ClusterPolicies de Kyverno (requieren sus CRDs, wave -2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: politicas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DanielVelAv/sa-platform-gitops.git
    targetRevision: main
    path: politicas
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
