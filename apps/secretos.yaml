# Wave -1: SealedSecret de sa-platform. El controlador (wave -3) lo descifra
# con la llave restaurada por Terraform -> Secret sa-platform-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secretos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DanielVelAv/sa-platform-gitops.git
    targetRevision: main
    path: secretos
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p9-produccion
  syncPolicy:
    automated: { prune: true, selfHeal: true }
