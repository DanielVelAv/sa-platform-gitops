# Wave 0: calendario y retencion de respaldos. Velero (y su CRD Schedule)
# lo instala Terraform antes de ArgoCD; aqui solo vive la politica.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-schedule
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DanielVelAv/sa-platform-gitops.git
    targetRevision: main
    path: velero
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
