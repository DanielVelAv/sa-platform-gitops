# Wave 1 (P10): configuracion de observabilidad propia del sistema:
# PodMonitor, reglas de SLO y alertas, tablero de Grafana y generador de
# trafico. Requiere los CRDs de kube-prometheus-stack (wave -2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observabilidad
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DanielVelAv/sa-platform-gitops.git
    targetRevision: main
    path: observabilidad
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
